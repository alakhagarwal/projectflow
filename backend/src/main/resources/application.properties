spring.application.name=project-management-system
spring.main.allow-circular-references=true

spring.datasource.url=jdbc:mysql://localhost:3306/project_management_system
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ===============================
# JWT
# ===============================
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.minutes=120

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FILE UPLOAD
# ===============================
# Max file size (default is 1MB)
spring.servlet.multipart.max-file-size=10MB
# Max request size (for multiple files or large requests)
spring.servlet.multipart.max-request-size=10MB
# Enable multipart uploads
spring.servlet.multipart.enabled=true

# ===============================
# AWS S3
# ===============================
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.bucket.name=${S3_BUCKET_NAME:alakh-pms-1}

# ===============================
# EMAIL CONFIGURATION
# ===============================

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
app.frontend.url=${FRONTEND_URL}
